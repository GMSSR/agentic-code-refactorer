[project]
name = "agentic-code-refactorer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langchain-core==1.4.1",
    "langchain-ollama==1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters==1.1.2",
    "litellm==1.88.0",
    "pydantic==2.13.4",
    "pylint>=4.0.6",
    "pysonar>=1.6.0.4905",
    "python-dotenv==1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "sonarqube-sdk>=0.1.0",
]

[dependency-groups]
dev = [
    "pysonar>=1.6.0.4905",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]

[tool.uv]
exclude-newer = "3 days"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
